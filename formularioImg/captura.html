<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Jugador</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .form-container { background-color: #b3c2d6; padding: 20px; width: 420px; border-radius: 4px; box-shadow: 1px 1px 5px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #111; margin-top: 0; font-size: 1.5em; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #222; }
        input[type="text"], input[type="number"] { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 3px; }
        .checkbox-group, .radio-group { margin-left: 5px; }
        .checkbox-group label, .radio-group label { display: inline; font-weight: normal; }
        .buttons { display: flex; gap: 10px; margin-top: 15px; }
        input[type="submit"], input[type="reset"] { padding: 8px 16px; border: none; border-radius: 3px; cursor: pointer; color: white; font-weight: bold; }
        .btn-submit { background-color: #0056b3; }
        .btn-reset { background-color: #007bff; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Formulario de Jugador</h2>
    <form action="index.php" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras y espacios">
        </div>
        
        <div class="form-group">
            <label for="alias">Alias:</label>
            <input type="text" id="alias" name="alias" required pattern="[a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras, números y espacios">
        </div>
        
        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" required min="1" max="120">
        </div>
        
        <div class="form-group">
            <label>Armas a elegir (puedes elegir varias):</label>
            <div class="checkbox-group">
                <input type="checkbox" id="maza" name="armas[]" value="Maza"> <label for="maza">Maza</label><br>
                <input type="checkbox" id="antorcha" name="armas[]" value="Antorcha"> <label for="antorcha">Antorcha</label><br>
                <input type="checkbox" id="martillo" name="armas[]" value="Martillo"> <label for="martillo">Martillo</label><br>
                <input type="checkbox" id="latigo" name="armas[]" value="Látigo"> <label for="latigo">Látigo</label>
            </div>
        </div>
        
        <div class="form-group">
            <label>¿Practica artes mágicas?</label>
            <div class="radio-group">
                <input type="radio" id="magia_si" name="magia" value="Sí" checked> <label for="magia_si">Sí</label><br>
                <input type="radio" id="magia_no" name="magia" value="No"> <label for="magia_no">No</label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="imagen">Subir imagen:</label>
            <input type="file" id="imagen" name="imagen" accept="image/png">
        </div>
        
        <div class="buttons">
            <input type="submit" class="btn-submit" value="Enviar">
            <input type="reset" class="btn-reset" value="Borrar">
        </div>
    </form>
</div>

</body>
